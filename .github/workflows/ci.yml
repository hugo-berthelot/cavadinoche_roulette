name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Logique de jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Aucune dependance a installer : les tests portent sur des modules purs
      # et tournent sur le lanceur integre a Node.
      - run: node --test test/*.test.js
