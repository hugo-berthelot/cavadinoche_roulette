name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Moindre privilege explicite : ces tests n'ont besoin que de lire le code.
# Sans cette declaration, le job herite du reglage du depot, qui peut donner
# l'ecriture au jeton -- inutile ici, et c'est autant de surface en moins si
# une dependance de workflow venait a etre compromise.
permissions:
  contents: read

jobs:
  unit:
    name: Logique de jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Aucune dependance a installer : les tests portent sur des modules purs
      # et tournent sur le lanceur integre a Node.
      - run: node --test test/*.test.js
