name: Mise en ligne

on:
  push:
    # La branche par defaut du depot est `claude/drinking-game-card-app-2kidki`
    # (GitHub la fixe sur la premiere branche poussee dans un depot vide), et
    # l'environnement github-pages n'autorise les deploiements que depuis la
    # branche par defaut. On declenche donc sur les deux : le site se publie
    # quelle que soit celle qui porte ce role.
    branches: [main, claude/drinking-game-card-app-2kidki]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne a la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # `enablement` demande a l'action de creer le site Pages s'il n'existe
        # pas. Le GITHUB_TOKEN n'y arrive pas seul : creer un site Pages exige
        # des droits admin que `pages: write` ne donne pas (l'API repond
        # "Resource not accessible by integration"). L'activation initiale se
        # fait donc une fois a la main, dans Settings > Pages > Source :
        # GitHub Actions. Le parametre reste utile ensuite : il rend le job
        # idempotent si le site venait a etre supprime.
        with:
          enablement: true
      # Le site est deja statique : rien a construire, on publie le depot tel quel.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
