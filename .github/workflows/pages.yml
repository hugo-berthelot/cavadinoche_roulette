name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne a la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Pages n'est pas encore active sur le depot : on laisse l'action le
        # faire elle-meme (le job a deja la permission `pages: write`), plutot
        # que d'exiger un reglage manuel dans Settings.
        with:
          enablement: true
      # Le site est deja statique : rien a construire, on publie le depot tel quel.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
